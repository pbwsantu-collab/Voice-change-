    // Page 25 — Verbs of Perception
    { q: "They saw him steal the bag.", type: "Perception", answer: "He was seen to steal the bag.", explanation: "see → be seen + to infinitive.", rule: "Perception: see" },
    { q: "People heard her sing a song.", type: "Perception", answer: "She was heard to sing a song.", explanation: "hear → be heard + to infinitive.", rule: "Perception: hear" },
    { q: "We watched them play football.", type: "Perception", answer: "They were watched to play football.", explanation: "watch → be watched + to infinitive.", rule: "Perception: watch" },
    { q: "They noticed him enter the room.", type: "Perception", answer: "He was noticed to enter the room.", explanation: "notice → be noticed + to infinitive.", rule: "Perception: notice" },
    { q: "Someone heard the baby cry.", type: "Perception", answer: "The baby was heard to cry.", explanation: "hear → be heard + to infinitive.", rule: "Perception: hear" },
    { q: "They saw her cross the road.", type: "Perception", answer: "She was seen to cross the road.", explanation: "see → be seen + to infinitive.", rule: "Perception: see" }
  ];

  // --------------------------------------------------------------
  // App state
  // --------------------------------------------------------------
  let currentFilter = 'all';
  let activeIndex = null;

  const grid = document.getElementById('questionGrid');
  const answerBox = document.getElementById('answerBox');
  const answerHead = document.getElementById('answerHead');
  const answerDetail = document.getElementById('answerDetail');
  const answerRule = document.getElementById('answerRule');
  const totalCount = document.getElementById('totalCount');
  const activeFilterSpan = document.getElementById('activeFilter');

  // Filter buttons
  const filterBtns = document.querySelectorAll('.filter-btn');

  function getFilteredQuestions() {
    if (currentFilter === 'all') return allQuestions;
    return allQuestions.filter(q => q.type === currentFilter);
  }

  function renderQuestions() {
    const filtered = getFilteredQuestions();
    totalCount.textContent = filtered.length;
    activeFilterSpan.textContent = currentFilter === 'all' ? 'all' : currentFilter;

    grid.innerHTML = '';
    filtered.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'q-item';
      div.dataset.index = idx;
      div.innerHTML = `
        <span class="q-text">${item.q}</span>
        <span class="q-meta">
          <span class="q-type">${item.type}</span>
          <span class="q-arrow">▶</span>
        </span>
      `;
      div.addEventListener('click', function() {
        const index = parseInt(this.dataset.index);
        showAnswer(index);
      });
      grid.appendChild(div);
    });

    // Clear answer box when filtering
    answerBox.classList.remove('active');
    activeIndex = null;
  }

  function showAnswer(index) {
    const filtered = getFilteredQuestions();
    const q = filtered[index];
    if (!q) return;
    activeIndex = index;
    answerHead.textContent = `✏️ ${q.q}`;
    answerDetail.innerHTML = `<strong>✔️ ${q.answer}</strong><br><span style="display:block; margin-top: 0.3rem;">${q.explanation}</span>`;
    answerRule.textContent = `📖 rule: ${q.rule}`;
    answerBox.classList.add('active');

    // Highlight active question
    document.querySelectorAll('.q-item').forEach(el => el.classList.remove('active-q'));
    const target = document.querySelector(`.q-item[data-index="${index}"]`);
    if (target) target.classList.add('active-q');
    
    answerBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // Filter click
  filterBtns.forEach(btn => {
    btn.addEventListener('click', function() {
      filterBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      currentFilter = this.dataset.filter;
      renderQuestions();
    });
  });

  // Reset
  document.getElementById('resetBtn').addEventListener('click', function() {
    answerBox.classList.remove('active');
    document.querySelectorAll('.q-item').forEach(el => el.classList.remove('active-q'));
    activeIndex = null;
    // Reset filter to 'all'
    filterBtns.forEach(b => b.classList.remove('active'));
    document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
    currentFilter = 'all';
    renderQuestions();
  });

  // Initial render
  renderQuestions();

  // Show first question after load
  setTimeout(() => {
    const filtered = getFilteredQuestions();
    if (filtered.length) {
      showAnswer(0);
    }
  }, 300);
})();
</script>
